name: Capture

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  capture:
    name: Capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: capture/requirements*.txt
      - run: python -m pip install -r capture/requirements-dev.txt
      - run: python -m ruff check capture
      - run: python -m pytest capture/tests -v
