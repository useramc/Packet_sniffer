name: CI

# PPS-14. Runs on every PR into develop/main (matches SAD A.3 branching
# strategy: main <- develop <- feature/PPS-F-0xx-*), plus pushes to those
# branches directly.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          # CI-only throwaway secret. Real deployments set PPS_JWT_SECRET
          # via repo/environment secrets, never a literal in this file
          # (PPS-SR-004: no hardcoded credentials/secrets).
          PPS_JWT_SECRET: ${{ secrets.PPS_JWT_SECRET != '' && secrets.PPS_JWT_SECRET || 'ci-only-throwaway-secret' }}
        run: pytest -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
