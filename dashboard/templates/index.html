<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pocket Packet Sniffer - Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .panel { border: 1px solid #999; padding: 10px; margin-bottom: 15px; }
    .box { border: 1px dashed #bbb; height: 80px; }
    .alert-card { border: 1px solid #999; padding: 8px; margin-bottom: 8px; }
    .severity { padding: 2px 8px; font-weight: bold; color: #000; }
    .severity-critical { background: red; color: #fff; }
    .severity-high { background: orange; }
    .severity-medium { background: yellow; }
    .severity-low { background: lightgreen; }
  </style>
</head>
<body>
  <h1>Pocket Packet Sniffer</h1>

  <div class="panel" id="session-controls">
    <h2>Session Controls</h2>
    <label>Interface: <select id="interface"></select></label>
    <button id="start-btn">Start</button>
    <button id="pause-btn">Pause</button>
    <button id="stop-btn">Stop</button>
    <p>Status: <b id="status">idle</b></p>
    <p id="message"></p>
  </div>

  <div class="panel" id="live-stats">
    <h2>Live Traffic Statistics</h2>
    <p id="no-session">No active session</p>
    <div id="stats-content" hidden>
      <p>Packets/sec: <b id="packets-per-sec">0</b></p>
      <h3>Top Talkers</h3>
      <table border="1" cellpadding="4">
        <thead><tr><th>IP</th><th>Packets</th></tr></thead>
        <tbody id="talkers-body"></tbody>
      </table>
      <h3>Protocol Breakdown</h3>
      <table border="1" cellpadding="4">
        <thead><tr><th>Protocol</th><th>Packets</th></tr></thead>
        <tbody id="protocols-body"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="hosts">
    <h2>Hosts</h2>
    <div class="box"></div>
  </div>

  <div class="panel" id="alerts">
    <h2>Alerts</h2>
    <p id="alerts-no-session">No active session</p>
    <div id="alerts-list" hidden></div>
  </div>

  <script>
    const interfaceSelect = document.getElementById("interface");
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const stopBtn = document.getElementById("stop-btn");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const noSessionEl = document.getElementById("no-session");
    const statsContentEl = document.getElementById("stats-content");
    const packetsEl = document.getElementById("packets-per-sec");
    const talkersBody = document.getElementById("talkers-body");
    const protocolsBody = document.getElementById("protocols-body");
    const alertsNoSessionEl = document.getElementById("alerts-no-session");
    const alertsListEl = document.getElementById("alerts-list");

    async function loadInterfaces() {
      const res = await fetch("/api/interfaces");
      const data = await res.json();
      for (const name of data.interfaces) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        interfaceSelect.appendChild(option);
      }
    }

    function updateControls(status) {
      const active = status === "running" || status === "paused";
      statusEl.textContent = status;
      interfaceSelect.disabled = active;
      startBtn.disabled = active;
      pauseBtn.disabled = !active;
      stopBtn.disabled = !active;
      pauseBtn.textContent = status === "paused" ? "Resume" : "Pause";
    }

    async function refreshStatus() {
      const res = await fetch("/api/capture/status");
      const data = await res.json();
      updateControls(data.status);
    }

    function showStats(data) {
      packetsEl.textContent = data.packets_per_sec;
      talkersBody.innerHTML = "";
      for (const talker of data.top_talkers) {
        const row = talkersBody.insertRow();
        row.insertCell().textContent = talker.ip;
        row.insertCell().textContent = talker.packets;
      }
      protocolsBody.innerHTML = "";
      for (const [name, count] of Object.entries(data.protocols)) {
        const row = protocolsBody.insertRow();
        row.insertCell().textContent = name;
        row.insertCell().textContent = count;
      }
      noSessionEl.hidden = true;
      statsContentEl.hidden = false;
    }

    async function refreshStats() {
      const status = statusEl.textContent;
      if (status === "paused") return;
      if (status !== "running") {
        noSessionEl.hidden = false;
        statsContentEl.hidden = true;
        return;
      }
      const res = await fetch("/api/stats");
      if (!res.ok) return;
      showStats(await res.json());
    }

    function showAlerts(data) {
      alertsListEl.innerHTML = "";
      for (const alert of data.alerts) {
        const card = document.createElement("div");
        card.className = "alert-card";
        const severity = document.createElement("span");
        severity.className = "severity severity-" + alert.severity;
        severity.textContent = alert.severity;
        const message = document.createElement("span");
        message.textContent = " " + alert.message;
        const time = document.createElement("div");
        time.textContent = alert.time;
        card.append(severity, message, time);
        alertsListEl.appendChild(card);
      }
      alertsNoSessionEl.hidden = true;
      alertsListEl.hidden = false;
    }

    async function refreshAlerts() {
      const status = statusEl.textContent;
      if (status === "paused") return;
      if (status !== "running") {
        alertsNoSessionEl.hidden = false;
        alertsListEl.hidden = true;
        return;
      }
      const res = await fetch("/api/alerts");
      if (!res.ok) return;
      showAlerts(await res.json());
    }

    async function sendAction(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      messageEl.textContent = res.ok ? "" : data.message;
      await refreshStatus();
      refreshStats();
      refreshAlerts();
    }

    startBtn.onclick = () => sendAction("/api/capture/start", { interface: interfaceSelect.value });
    stopBtn.onclick = () => sendAction("/api/capture/stop");
    pauseBtn.onclick = () => sendAction(
      statusEl.textContent === "paused" ? "/api/capture/resume" : "/api/capture/pause"
    );

    loadInterfaces();
    refreshStatus().then(() => {
      refreshStats();
      refreshAlerts();
    });
    setInterval(refreshStatus, 1000);
    setInterval(refreshStats, 2000);
    setInterval(refreshAlerts, 2000);
  </script>
</body>
</html>
